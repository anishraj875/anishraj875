<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Anish Raj - Network Engineer banner with network topology" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2236"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1b3350" stroke-width="0.6" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg)"/>
  <rect width="900" height="300" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#049fd9" stroke-opacity="0.35"/>

  <!-- Text -->
  <text x="48" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="1">Anish Raj</text>
  <text x="50" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#049fd9" font-weight="600">Network Engineer</text>
  <text x="50" y="196" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9fb3c8">Routing  |  Switching  |  Network Security</text>
  <text x="50" y="232" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5fd38d">R1# show ip route<tspan fill="#9fb3c8"> _</tspan>
    <animate attributeName="opacity" values="1;1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- Links -->
  <g stroke="#049fd9" stroke-width="2" stroke-opacity="0.7" fill="none" stroke-dasharray="6 5">
    <line x1="740" y1="62" x2="740" y2="112"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="740" y1="136" x2="740" y2="166"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="740" y1="190" x2="660" y2="226"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="740" y1="190" x2="820" y2="226"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="660" y1="250" x2="660" y2="268"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="820" y1="250" x2="820" y2="268"><animate attributeName="stroke-dashoffset" from="22" to="0" dur="1.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- Cloud / Internet -->
  <g filter="url(#glow)">
    <ellipse cx="740" cy="44" rx="34" ry="18" fill="#12304a" stroke="#049fd9" stroke-width="2"/>
  </g>
  <text x="740" y="49" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#cfe9f7">WAN</text>

  <!-- Router -->
  <g filter="url(#glow)">
    <circle cx="740" cy="124" r="22" fill="#12304a" stroke="#049fd9" stroke-width="2.5"/>
  </g>
  <g stroke="#049fd9" stroke-width="2" stroke-linecap="round">
    <line x1="728" y1="124" x2="752" y2="124"/><line x1="740" y1="112" x2="740" y2="136"/>
    <line x1="731" y1="115" x2="749" y2="133"/><line x1="749" y1="115" x2="731" y2="133"/>
  </g>
  <text x="776" y="129" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8">R1</text>

  <!-- Core switch -->
  <g filter="url(#glow)">
    <rect x="708" y="166" width="64" height="24" rx="5" fill="#12304a" stroke="#049fd9" stroke-width="2.5"/>
  </g>
  <g fill="#049fd9">
    <rect x="716" y="174" width="6" height="8" rx="1"/><rect x="726" y="174" width="6" height="8" rx="1"/>
    <rect x="736" y="174" width="6" height="8" rx="1"/><rect x="746" y="174" width="6" height="8" rx="1"/>
    <rect x="756" y="174" width="6" height="8" rx="1"/>
  </g>
  <text x="780" y="183" font-family="Consolas, monospace" font-size="12" fill="#9fb3c8">SW1</text>

  <!-- Access switches -->
  <g stroke="#049fd9" stroke-width="2.5" fill="#12304a">
    <rect x="632" y="226" width="56" height="24" rx="5"/>
    <rect x="792" y="226" width="56" height="24" rx="5"/>
  </g>
  <g fill="#049fd9">
    <rect x="640" y="234" width="5" height="8" rx="1"/><rect x="649" y="234" width="5" height="8" rx="1"/>
    <rect x="658" y="234" width="5" height="8" rx="1"/><rect x="667" y="234" width="5" height="8" rx="1"/>
    <rect x="800" y="234" width="5" height="8" rx="1"/><rect x="809" y="234" width="5" height="8" rx="1"/>
    <rect x="818" y="234" width="5" height="8" rx="1"/><rect x="827" y="234" width="5" height="8" rx="1"/>
  </g>
  <text x="660" y="219" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb3c8">SW2 - VLAN 10</text>
  <text x="820" y="219" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9fb3c8">SW3 - VLAN 20</text>

  <!-- PCs -->
  <g stroke="#5fd38d" stroke-width="2" fill="#0f2236">
    <rect x="646" y="268" width="28" height="18" rx="2"/>
    <rect x="806" y="268" width="28" height="18" rx="2"/>
  </g>
  <g stroke="#5fd38d" stroke-width="2">
    <line x1="654" y1="292" x2="666" y2="292"/><line x1="814" y1="292" x2="826" y2="292"/>
  </g>
</svg>
